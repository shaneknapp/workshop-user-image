name: Build and push container image, and push update to jupyterhub repo if needed
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'README-template.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - '.github/**'
      - 'images/**'
      - 'image-tests/**'
      - 'browser-tests/**'

jobs:
  build-push-open-pr:
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      id-token: write
    # POC: branch ref for keyless testing. Flip to @0.5.0 once the tag is cut.
    uses: cal-icor/shared-workflows/.github/workflows/build-push-create-pr.yaml@keyless-gar-push
    with:
      image: ${{ vars.IMAGE}}
      hub: ${{ vars.HUB }}
      app_id: ${{ vars.APP_ID }}
      image_builder_bot_name: ${{ vars.IMAGE_BUILDER_BOT_NAME }}
      image_builder_bot_email: ${{ vars.IMAGE_BUILDER_BOT_EMAIL }}
      wif_provider: ${{ vars.GAR_WIF_PROVIDER }}
      gar_service_account: ${{ vars.GAR_SA }}
    secrets:
      PRIVATE_KEY_SECRET: ${{ secrets.PRIVATE_KEY_SECRET }}
